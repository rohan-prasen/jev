[project]
name = "jev"
version = "0.1.0"
description = "A python-rust pacakge build and developed using uv and maturin with py03"
readme = "README.md"
authors = [
    { name = "Rohan Prasen Kedari", email = "rohanprasenkedari@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "openai>=3.48.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
jev = "jev:main"

[tool.maturin]
module-name = "jev._core"
python-packages = ["jev"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
